name: enterprise_knowledge_search
display_name: 智能家居知识库检索
description: 检索设备手册、传感器指南、场景定义和安全规则，并基于来源回答问题。
version: 1.0.0
domains:
  - smart_home
  - rag
allowed_agents:
  - orchestrator
  - react
  - home_butler
  - environment
  - device_control
  - comfort
triggers:
  keywords:
    - knowledge base
    - internal document
    - device manual
    - home automation
    - 知识库
    - 内部文档
    - 设备手册
    - 家居自动化
tools:
  - search_enterprise_knowledge
  - list_knowledge_documents
required_tools:
  - search_enterprise_knowledge
optional_tools:
  - list_knowledge_documents
priority: 70
risk_level: medium

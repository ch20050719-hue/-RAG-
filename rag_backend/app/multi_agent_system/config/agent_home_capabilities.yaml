# 智能家居能力配置文件
# 通过 AGENT_CAPABILITIES_FILE 或 HOME_DOMAIN_MODE=1 切换使用

agents:
  # ==================== 总管家 ====================
  home_butler:
    agent_id: "home_butler_001"
    agent_name: "总管家"
    agent_type: "home_butler"
    enabled: true
    priority: 1
    allowed_tools:
      - read_home_environment
      - get_environment_history
      - get_home_alerts
      - list_home_devices
      - get_device_status
      - set_light_state
      - set_fan_state
      - set_sprinkler_pump_state
      - set_alarm_buzzer_state
      - get_automation_mode
      - set_automation_mode
      - get_environment_thresholds
      - set_environment_threshold
      - run_home_scenario
      - get_door_lock_status
      - open_door
      - close_door
      - unlock_door
      - lock_door
      - engage_deadbolt
      - release_deadbolt

    domains:
      - name: "home_orchestration"
        display_name: "家居总控"
        weight: 1.0
        examples:
          - "切换自动模式"
          - "查询家居状态"
          - "执行睡眠场景"

      - name: "device_natural_language"
        display_name: "自然语言控制"
        weight: 1.0
        examples:
          - "房间有点热"
          - "把灯打开"

    keywords:
      high_weight:
        - "管家"
        - "家里"
        - "家居"
        - "开灯"
        - "关灯"
        - "开风扇"
        - "关风扇"
        - "自动模式"
        - "睡眠模式"
        - "离家模式"
      medium_weight:
        - "房间"
        - "空调"
        - "灯光"
        - "风扇"
        - "设备"

    entities:
      - "房间"
      - "设备名"
      - "控制模式"
      - "阈值"

    patterns:
      - ".*(开|关).{0,4}(灯|风扇).*"
      - ".*自动模式.*"

  # ==================== 环境感知 ====================
  environment:
    agent_id: "home_environment_001"
    agent_name: "环境感知专家"
    agent_type: "environment"
    enabled: true
    priority: 2
    allowed_tools:
      - read_home_environment
      - get_environment_history
      - get_home_alerts
      - get_device_status
      - get_environment_thresholds
      - set_environment_threshold

    domains:
      - name: "sensor_reading"
        display_name: "传感器读数"
        weight: 1.0
        examples:
          - "现在室内多少度"
          - "湿度多少"

      - name: "comfort_assessment"
        display_name: "舒适度评估"
        weight: 0.9
        examples:
          - "现在适合开窗吗"
          - "是否检测到烟雾或火焰"

    keywords:
      high_weight:
        - "温度"
        - "湿度"
        - "烟雾"
        - "火焰"
        - "有人"
        - "传感器"
      medium_weight:
        - "热不热"
        - "冷不冷"
        - "报警"

    patterns:
      - ".*(温度|湿度|烟雾|火焰|有人).*"
      - ".*(多少度|多热|多冷).*"

  # ==================== 设备控制 ====================
  device_control:
    agent_id: "home_device_control_001"
    agent_name: "设备控制专家"
    agent_type: "device_control"
    enabled: true
    priority: 2
    allowed_tools:
      - list_home_devices
      - get_device_status
      - set_light_state
      - set_fan_state
      - set_sprinkler_pump_state
      - set_alarm_buzzer_state
      - get_door_lock_status
      - open_door
      - close_door
      - unlock_door
      - lock_door
      - engage_deadbolt
      - release_deadbolt

    domains:
      - name: "device_switch"
        display_name: "设备开关"
        weight: 1.0
        examples:
          - "打开书桌灯"
          - "关闭风扇"

      - name: "device_status"
        display_name: "设备状态"
        weight: 1.0
        examples:
          - "灯现在开着吗"
          - "列出设备状态"

    keywords:
      high_weight:
        - "打开"
        - "关闭"
        - "开启"
        - "关掉"
        - "设备状态"
      medium_weight:
        - "desk_light"
        - "desk_fan"
        - "灯"
        - "风扇"
        - "模式"
        - "门锁"
        - "门磁"
        - "反锁"
        - "开锁"

    patterns:
      - ".*(打开|关闭|开启|关掉).*(灯|风扇|设备).*"
      - ".*设备状态.*"

  # ==================== 舒适度 ====================
  comfort:
    agent_id: "home_comfort_001"
    agent_name: "舒适度专家"
    agent_type: "comfort"
    enabled: true
    priority: 3
    allowed_tools:
      - read_home_environment
      - get_home_alerts

    domains:
      - name: "environment_safety"
        display_name: "环境安全"
        weight: 1.0
        examples:
          - "烟雾报警怎么办"
          - "检测到火焰怎么办"

      - name: "energy_save"
        display_name: "节能建议"
        weight: 0.8
        examples:
          - "有人时自动开灯吗"
          - "如何处理高温"

    keywords:
      high_weight:
        - "有人"
        - "舒适"
        - "火焰"
      medium_weight:
        - "烟雾"
        - "报警"

    patterns:
      - ".*(有人|火焰|烟雾|报警).*"

  # ==================== 通用助手 ====================
  general:
    agent_id: "general_assistant_001"
    agent_name: "通用助手"
    agent_type: "general"
    enabled: true
    priority: 10

    domains:
      - name: "general_query"
        display_name: "通用查询"
        weight: 0.5
        examples:
          - "问候"
          - "闲聊"

    keywords:
      high_weight:
        - "你好"
        - "请问"
        - "帮助"

    patterns:
      - "^(你好|您好|hi|hello).*"

routing:
  default_confidence_threshold: 0.5
  max_specialists_per_request: 2
  enable_fallback: true

  intent_to_specialist:
    "home_control": "home_butler"
    "device_switch": "device_control"
    "device_status": "device_control"
    "sensor_reading": "environment"
    "comfort_assessment": "environment"
    "greeting": "general"
